[package]
name = "perfboard"
version = "0.1.3"
description = "Local hardware engineering toolbox"
authors = ["Perfboard"]
edition = "2021"
license = "MIT"

[lib]
name = "perfboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-updater = "=2.14.1"
semver = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "=0.10.9"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
url = "2"
open = "5"
mime_guess = "2"
base64 = "=0.22.1"
calamine = "=0.31.0"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = "0.62"
winreg = "0.55"
