<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开发日志 PDF 导出 · 交互说明</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171717;color:#e8e8e8;font:14px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1100px;margin:40px auto;padding:20px}h1{font-size:22px}small,.muted{color:#aaa}button{background:transparent;border:1px solid #454545;border-radius:6px;color:inherit;padding:7px 12px;cursor:pointer}button:hover{background:#363636}.app{display:grid;grid-template-columns:1fr 230px;border:1px solid #404040;border-radius:10px;overflow:hidden;margin-top:22px;min-height:420px}header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #404040}header strong{margin-right:auto}article{padding:24px;background:#222}article:focus{outline:1px solid #777}aside{border-left:1px solid #404040;padding:18px}aside button{display:block;width:100%;margin-bottom:8px;text-align:left}.active{background:#373737}#menu{position:fixed;background:#292929;border:1px solid #555;border-radius:6px;padding:6px;box-shadow:0 4px 20px #0008}dialog{color:#222;background:white;width:min(800px,90vw);max-height:85vh;border:0;border-radius:10px;padding:28px}dialog::backdrop{background:#0009}#preview{white-space:pre-wrap;padding:20px 0}dialog button{border-color:#aaa}.note{margin-top:20px;color:#bbb}
</style><main><h1>开发日志 · 本地 PDF 导出</h1><p class="muted">交互说明快照，只使用合成数据。此页演示导出范围；真正的 PDF 请在 Windows 桌面应用中生成。</p><div class="app"><section><header><strong id="title"></strong><small id="state"></small><button id="save">保存</button><button id="export">⇩ 导出 PDF</button></header><article id="editor" contenteditable="true" aria-label="演示日志正文"></article></section><aside><strong>开发日志</strong><p class="muted">右击页面名称导出</p><div id="pages"></div></aside></div><p class="note">当前页包含未保存草稿；右键其他页使用其保存内容，保持当前页和草稿。正式 PDF 为 A4 白底，原图按比例缩放，长文自动分页。</p><p><a href="../../docs/DEV-LOG-PDF-20261022.md" style="color:#c1d9ff">实现与人工验收说明</a></p><div id="menu" hidden><button id="contextExport">导出为 PDF</button></div><dialog id="dialog"><small>导出内容预览 · 本演示不生成 PDF</small><h2 id="previewTitle"></h2><div id="preview"></div><button id="close">返回编辑</button></dialog></main>
<script>
const pages=[{title:'电源调试记录',saved:'输入 24 V，输出 12 V。\n\n已完成：检查输出纹波。\n待办：记录带载温升。'},{title:'下一阶段计划',saved:'整理 PCB 修改清单。\n核对元件规格书。'}];let current=0,draft=pages[0].saved,target=0;const $=id=>document.getElementById(id);function render(){ $('title').textContent=pages[current].title;$('editor').textContent=draft;$('state').textContent=draft===pages[current].saved?'已保存':'未保存';$('pages').replaceChildren(...pages.map((p,i)=>{const b=document.createElement('button');b.textContent=p.title;b.className=i===current?'active':'';b.onclick=()=>{if(draft!==pages[current].saved){$('state').textContent='请先保存当前草稿';return}current=i;draft=p.saved;render()};b.oncontextmenu=e=>{e.preventDefault();target=i;$('menu').hidden=false;$('menu').style.left=e.clientX+'px';$('menu').style.top=e.clientY+'px'};return b}))}function preview(i){$('menu').hidden=true;$('previewTitle').textContent=pages[i].title;$('preview').textContent=i===current?draft:pages[i].saved;$('dialog').showModal()}$('editor').oninput=()=>{draft=$('editor').innerText;$('state').textContent=draft===pages[current].saved?'已保存':'未保存'};$('save').onclick=()=>{pages[current].saved=draft;render()};$('export').onclick=()=>preview(current);$('contextExport').onclick=()=>preview(target);$('close').onclick=()=>$('dialog').close();document.addEventListener('click',e=>{if(!$('menu').contains(e.target))$('menu').hidden=true});render();
</script></html>
